<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users Management | SmartPark AI</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Users Management CSS -->
    <link rel="stylesheet" href="css/users.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<div class="container">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="page-header">

        <!-- Back to Admin Dashboard -->

        <a href="admin.html"
           class="back-admin-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Admin Dashboard

        </a>


        <div>

            <h1>
                Users Management
            </h1>

            <p>
                Manage registered residents, accounts and
                residential information
            </p>

        </div>

    </header>



    <!-- =========================================
         USER STATISTICS
    ========================================== -->

    <section class="stats-grid">


        <!-- Total Users -->

        <div class="stat-card">

            <div class="stat-icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <div>

                <h4>
                    Total Users
                </h4>

                <h2 id="totalUsers">
                    0
                </h2>

            </div>

        </div>



        <!-- Approved Users -->

        <div class="stat-card">

            <div class="stat-icon">
                <i class="fa-solid fa-user-check"></i>
            </div>

            <div>

                <h4>
                    Approved
                </h4>

                <h2 id="approvedUsers">
                    0
                </h2>

            </div>

        </div>



        <!-- Pending Users -->

        <div class="stat-card">

            <div class="stat-icon">
                <i class="fa-solid fa-user-clock"></i>
            </div>

            <div>

                <h4>
                    Pending
                </h4>

                <h2 id="pendingUsers">
                    0
                </h2>

            </div>

        </div>

    </section>



    <!-- =========================================
         SEARCH
    ========================================== -->

    <section class="search-section">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, vehicle or door number...">

        </div>

    </section>



    <!-- =========================================
         USER RECORDS
    ========================================== -->

    <section class="users-section">


        <div class="section-header">

            <div>

                <h2>

                    <i class="fa-solid fa-address-book"></i>

                    Resident Records

                </h2>

                <p>
                    View and manage registered residents.
                </p>

            </div>

        </div>



        <!-- User cards are generated by users.js -->

        <div
            id="usersContainer"
            class="users-grid">

        </div>


    </section>


</div>
<!-- =========================================
     RESIDENT DETAILS MODAL
========================================== -->

<div id="userModal" class="user-modal">

    <div class="user-modal-content">

        <button
            id="closeUserModal"
            class="close-modal-btn">

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div class="modal-user-avatar" id="modalUserAvatar">
            K
        </div>


        <h2 id="modalUserName">
            Resident Name
        </h2>


        <span
            id="modalUserStatus"
            class="status-badge">

            APPROVED

        </span>


        <div class="modal-user-details">

            <div class="modal-detail">

                <i class="fa-solid fa-envelope"></i>

                <div>

                    <span>Email</span>

                    <strong id="modalUserEmail">
                        N/A
                    </strong>

                </div>

            </div>


            <div class="modal-detail">

                <i class="fa-solid fa-phone"></i>

                <div>

                    <span>Phone</span>

                    <strong id="modalUserPhone">
                        N/A
                    </strong>

                </div>

            </div>


            <div class="modal-detail">

                <i class="fa-solid fa-door-open"></i>

                <div>

                    <span>Door Number</span>

                    <strong id="modalUserDoor">
                        N/A
                    </strong>

                </div>

            </div>


            <div class="modal-detail">

                <i class="fa-solid fa-car"></i>

                <div>

                    <span>Vehicle Number</span>

                    <strong id="modalUserVehicle">
                        N/A
                    </strong>

                </div>

            </div>

        </div>


        <button
            id="closeUserModalBottom"
            class="modal-close-btn">

            Close

        </button>

    </div>

</div>



<!-- =========================================
     JAVASCRIPT
========================================== -->

<script
    type="module"
    src="js/users.js">
</script>


</body>

</html>
